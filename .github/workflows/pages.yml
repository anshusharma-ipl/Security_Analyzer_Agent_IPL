# Publishes the static site (console replay, Guide, PRD, Cost, Canvas, test cases) to GitHub Pages.
# One-time setup: repository Settings > Pages > Build and deployment > Source: GitHub Actions.
# The live console (ui/server.py) cannot run on Pages; see docs/DEPLOY.md.
name: Publish site
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ui/site_build.py
      - run: python ui/replay/build.py
      - run: python ui/replay/build_static.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
